include: package:dart_test_tools/package.yaml

analyzer:
  exclude:
    - "**.freezed.dart"
    - "example/web/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    comment_references: false
    avoid_catches_without_on_clauses: false
