name: _
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/sodium
  - packages/sodium/example
  - packages/sodium_libs

dev_dependencies:
  dart_test_tools: ^8.2.0

hooks:
  user_defines:
    sodium:
      skip_missing_binaries: true
      export_headers: true
      verbose: true

renovate:
  pre_build_command: |
    set -e
    cd packages/sodium
    dart run tool/libsodium/download.dart
    dart run tool/libsodium/ffigen.dart
    dart run tool/libsodium/jsgen.dart
